name: Release

run-name: Release ${{ inputs.bump_type }}

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'The release to cut from the last one'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read
  actions: write

concurrency:
  group: release

jobs:
  release:
    uses: alexdlaird/.github/.github/workflows/release-main.yml@main
    with:
      bump_type: ${{ inputs.bump_type }}
      version_file: lib/fastlane/plugin/bosun/version.rb
      version_pattern: 's/VERSION = ".*"/VERSION = "${VERSION}"/'
      release_files: Gemfile.lock
      move_major_tag: true
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
